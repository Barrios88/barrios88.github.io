button{background:var(--accent);color:var(--bg);border-color:var(--accent);cursor:pointer;font-weight:600}
.e{color:var(--err);font-size:14px;min-height:1.2em}
</style></head><body>

async function open_(pw){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
