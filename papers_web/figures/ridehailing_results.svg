<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title-text { font-size: 23px; font-weight: 600; fill: #00356b; }
      .panel-label { font-size: 14px; font-weight: 600; fill: #00356b; }
      .axis-label { font-size: 12px; fill: #6b7280; }
      .cat-label { font-size: 12px; fill: #3f4650; font-weight: 500; }
      .value-text { font-size: 13px; fill: #00356b; font-weight: 600; }
      .note-text { font-size: 11px; fill: #6b7280; font-style: italic; }
      .box-title { font-size: 12.5px; fill: #00356b; font-weight: 600; }
      .box-text { font-size: 11px; fill: #3f4650; }
    </style>
    <marker id="rh-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1a4f8a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="50" y="42" class="title-text">Ridehailing and Traffic Fatalities: Key Estimates</text>

  <!-- ===================== PANEL A ===================== -->
  <g id="panel-a">
    <text x="90" y="82" class="panel-label">A. Overall effect on fatal accidents &amp; fatalities</text>

    <!-- Gridlines + y ticks (0 to 6%) -->
    <line x1="90" y1="250" x2="470" y2="250" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="90" y1="280" x2="470" y2="280" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="90" y1="310" x2="470" y2="310" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="90" y1="340" x2="470" y2="340" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="90" y1="370" x2="470" y2="370" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="90" y1="400" x2="470" y2="400" stroke="#e7e9ec" stroke-width="1"/>

    <text x="80" y="254" class="axis-label" text-anchor="end">6%</text>
    <text x="80" y="284" class="axis-label" text-anchor="end">5%</text>
    <text x="80" y="314" class="axis-label" text-anchor="end">4%</text>
    <text x="80" y="344" class="axis-label" text-anchor="end">3%</text>
    <text x="80" y="374" class="axis-label" text-anchor="end">2%</text>
    <text x="80" y="404" class="axis-label" text-anchor="end">1%</text>
    <text x="80" y="434" class="axis-label" text-anchor="end">0%</text>

    <!-- Axes -->
    <line x1="90" y1="250" x2="90" y2="430" stroke="#9aa1ab" stroke-width="1.5"/>
    <line x1="90" y1="430" x2="470" y2="430" stroke="#9aa1ab" stroke-width="1.5"/>
    <text x="42" y="345" class="axis-label" text-anchor="middle" transform="rotate(-90, 42, 345)">Effect on count (%)</text>

    <!-- Bars (3.6% each) -->
    <rect x="150" y="322" width="70" height="108" fill="#00356b"/>
    <rect x="300" y="322" width="70" height="108" fill="#1a4f8a"/>

    <!-- 95% CI whiskers -->
    <line x1="185" y1="278.5" x2="185" y2="365.5" stroke="#00356b" stroke-width="2" opacity="0.75"/>
    <line x1="177" y1="278.5" x2="193" y2="278.5" stroke="#00356b" stroke-width="2" opacity="0.75"/>
    <line x1="177" y1="365.5" x2="193" y2="365.5" stroke="#00356b" stroke-width="2" opacity="0.75"/>
    <line x1="335" y1="276.7" x2="335" y2="367.3" stroke="#00356b" stroke-width="2" opacity="0.75"/>
    <line x1="327" y1="276.7" x2="343" y2="276.7" stroke="#00356b" stroke-width="2" opacity="0.75"/>
    <line x1="327" y1="367.3" x2="343" y2="367.3" stroke="#00356b" stroke-width="2" opacity="0.75"/>

    <!-- Value labels -->
    <text x="185" y="270" class="value-text" text-anchor="middle">3.6%</text>
    <text x="335" y="270" class="value-text" text-anchor="middle">3.6%</text>

    <!-- Category labels -->
    <text x="185" y="448" class="cat-label" text-anchor="middle">Total</text>
    <text x="185" y="463" class="cat-label" text-anchor="middle">accidents</text>
    <text x="335" y="448" class="cat-label" text-anchor="middle">Total</text>
    <text x="335" y="463" class="cat-label" text-anchor="middle">fatalities</text>

    <text x="90" y="487" class="note-text">Main specification (city linear trend). 2%&#8211;4% across specifications; ~5% at the CBSA level.</text>
  </g>

  <!-- ===================== PANEL B ===================== -->
  <g id="panel-b">
    <text x="580" y="82" class="panel-label">B. Pedestrian &amp; cyclist externality (Table 6)</text>

    <!-- Gridlines -->
    <line x1="580" y1="250" x2="950" y2="250" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="580" y1="280" x2="950" y2="280" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="580" y1="310" x2="950" y2="310" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="580" y1="340" x2="950" y2="340" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="580" y1="370" x2="950" y2="370" stroke="#e7e9ec" stroke-width="1"/>
    <line x1="580" y1="400" x2="950" y2="400" stroke="#e7e9ec" stroke-width="1"/>

    <text x="570" y="254" class="axis-label" text-anchor="end">6%</text>
    <text x="570" y="284" class="axis-label" text-anchor="end">5%</text>
    <text x="570" y="314" class="axis-label" text-anchor="end">4%</text>
    <text x="570" y="344" class="axis-label" text-anchor="end">3%</text>
    <text x="570" y="374" class="axis-label" text-anchor="end">2%</text>
    <text x="570" y="404" class="axis-label" text-anchor="end">1%</text>
    <text x="570" y="434" class="axis-label" text-anchor="end">0%</text>

    <!-- Reference line at overall 3.6% effect -->
    <line x1="580" y1="322" x2="950" y2="322" stroke="#1d63d8" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.7"/>
    <text x="946" y="317" class="axis-label" text-anchor="end" fill="#1d63d8">Overall ~3.6%</text>

    <!-- Axes -->
    <line x1="580" y1="250" x2="580" y2="430" stroke="#9aa1ab" stroke-width="1.5"/>
    <line x1="580" y1="430" x2="950" y2="430" stroke="#9aa1ab" stroke-width="1.5"/>

    <!-- Bars: 2.45%, 2.45%, 2.77% -->
    <rect x="617" y="356.5" width="56" height="73.5" fill="#6f9bcc"/>
    <rect x="717" y="356.5" width="56" height="73.5" fill="#6f9bcc"/>
    <rect x="817" y="346.9" width="56" height="83.1" fill="#1d63d8"/>

    <!-- 95% CI whiskers -->
    <line x1="645" y1="322.3" x2="645" y2="390.7" stroke="#1a4f8a" stroke-width="2" opacity="0.75"/>
    <line x1="637" y1="322.3" x2="653" y2="322.3" stroke="#1a4f8a" stroke-width="2" opacity="0.75"/>
    <line x1="637" y1="390.7" x2="653" y2="390.7" stroke="#1a4f8a" stroke-width="2" opacity="0.75"/>
    <line x1="745" y1="322.3" x2="745" y2="390.7" stroke="#1a4f8a" stroke-width="2" opacity="0.75"/>
    <line x1="737" y1="322.3" x2="753" y2="322.3" stroke="#1a4f8a" stroke-width="2" opacity="0.75"/>
    <line x1="737" y1="390.7" x2="753" y2="390.7" stroke="#1a4f8a" stroke-width="2" opacity="0.75"/>
    <line x1="845" y1="310.3" x2="845" y2="383.5" stroke="#1a4f8a" stroke-width="2" opacity="0.75"/>
    <line x1="837" y1="310.3" x2="853" y2="310.3" stroke="#1a4f8a" stroke-width="2" opacity="0.75"/>
    <line x1="837" y1="383.5" x2="853" y2="383.5" stroke="#1a4f8a" stroke-width="2" opacity="0.75"/>

    <!-- Value labels -->
    <text x="645" y="300" class="value-text" text-anchor="middle">2.45%</text>
    <text x="745" y="300" class="value-text" text-anchor="middle">2.45%</text>
    <text x="845" y="300" class="value-text" text-anchor="middle">2.77%</text>

    <!-- Category labels -->
    <text x="645" y="448" class="cat-label" text-anchor="middle">Ped.-involved</text>
    <text x="645" y="463" class="cat-label" text-anchor="middle">accidents</text>
    <text x="745" y="448" class="cat-label" text-anchor="middle">Ped.-involved</text>
    <text x="745" y="463" class="cat-label" text-anchor="middle">fatalities</text>
    <text x="845" y="448" class="cat-label" text-anchor="middle">Pedestrians</text>
    <text x="845" y="463" class="cat-label" text-anchor="middle">involved</text>

    <text x="580" y="487" class="note-text">The externality reaches bystanders, but all three estimates fall below the ~3.6% overall effect.</text>
  </g>

  <!-- ===================== PANEL C ===================== -->
  <g id="panel-c">
    <text x="90" y="533" class="panel-label">C. Why fatalities rise</text>

    <!-- Mechanism box 1 -->
    <rect x="90" y="550" width="150" height="90" fill="#f8f9fa" stroke="#1a4f8a" stroke-width="1.6" rx="4"/>
    <text x="165" y="576" class="box-title" text-anchor="middle">Road usage &#8593;</text>
    <text x="165" y="600" class="box-text" text-anchor="middle">VMT, congestion, and</text>
    <text x="165" y="615" class="box-text" text-anchor="middle">hours of delay all rise</text>

    <!-- Mechanism box 2 -->
    <rect x="260" y="550" width="150" height="90" fill="#f8f9fa" stroke="#1a4f8a" stroke-width="1.6" rx="4"/>
    <text x="335" y="576" class="box-title" text-anchor="middle">Registrations &#8593;</text>
    <text x="335" y="600" class="box-text" text-anchor="middle">~3% more new car</text>
    <text x="335" y="615" class="box-text" text-anchor="middle">registrations</text>

    <!-- Mechanism box 3 -->
    <rect x="430" y="550" width="150" height="90" fill="#f8f9fa" stroke="#1a4f8a" stroke-width="1.6" rx="4"/>
    <text x="505" y="576" class="box-title" text-anchor="middle">Driver quality &#8595;</text>
    <text x="505" y="600" class="box-text" text-anchor="middle">No drop in drunk-</text>
    <text x="505" y="615" class="box-text" text-anchor="middle">driving fatalities</text>

    <!-- Arrow to outcome -->
    <line x1="580" y1="595" x2="608" y2="595" stroke="#1a4f8a" stroke-width="2.5" marker-end="url(#rh-arrow)"/>

    <!-- Outcome box -->
    <rect x="612" y="550" width="338" height="90" fill="#eef3fb" stroke="#1d63d8" stroke-width="2" rx="4"/>
    <text x="781" y="580" class="box-title" text-anchor="middle" font-size="14">~3.6% more fatal accidents &amp; fatalities</text>
    <text x="781" y="606" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d63d8">$5.33B &#8211; $13.24B annual cost</text>
    <text x="781" y="626" class="box-text" text-anchor="middle" font-style="italic" fill="#6b7280">Reduced drunk driving does not offset the net increase</text>
  </g>

  <!-- Bottom source note -->
  <text x="50" y="682" class="note-text">Source: Barrios, Hochberg &amp; Yi (J. Oper. Manag. 2023), Tables 2 &amp; 6. Bars are DiD point estimates; whiskers are 95% CIs from city-clustered SEs.</text>
</svg>
