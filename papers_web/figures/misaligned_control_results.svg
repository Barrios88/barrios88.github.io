<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="fig1-title fig1-desc"
     font-family="'Inter', system-ui, -apple-system, sans-serif">
  <title id="fig1-title">How PE-backed deals escape premerger notification</title>
  <desc id="fig1-desc">Schematic line chart of premerger notification rates by transaction value. Both all-deal and PE-backed curves are near zero below the HSR reporting threshold, then rise sharply above it toward near-universal notification for large deals. Across the roughly $100 million to $500 million range the PE-backed curve sits at least 25 percentage points below the all-deals curve. A callout notes that antitrust enforcement falls by about 90 percent for deals exempt from HSR notification.</desc>

  <!-- background -->
  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>

  <!-- title -->
  <text x="460" y="42" text-anchor="middle" font-family="'Crimson Pro', Georgia, serif"
        font-size="27" font-weight="700" fill="#00356b">How PE-Backed Deals Escape Notification</text>
  <text x="460" y="66" text-anchor="middle" font-size="14" fill="#6b7280">
    Premerger notification rate by transaction value</text>

  <!-- band header bracket (defines the $100M-$500M region) -->
  <path d="M 166.36 100 L 166.36 94 L 431.82 94 L 431.82 100" fill="none" stroke="#1d63d8" stroke-width="1.2"/>
  <text x="299.09" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#1d63d8">$100M&#8211;$500M range</text>

  <!-- ===== PLOT ===== -->
  <!-- shaded band -->
  <rect x="166.36" y="105" width="265.46" height="285" fill="#1d63d8" fill-opacity="0.07"/>

  <!-- horizontal gridlines -->
  <line x1="100" y1="176.25" x2="830" y2="176.25" stroke="#e7e9ec" stroke-width="0.8"/>
  <line x1="100" y1="247.50" x2="830" y2="247.50" stroke="#e7e9ec" stroke-width="0.8"/>
  <line x1="100" y1="318.75" x2="830" y2="318.75" stroke="#e7e9ec" stroke-width="0.8"/>
  <line x1="100" y1="105.00" x2="830" y2="105.00" stroke="#e7e9ec" stroke-width="0.8"/>

  <!-- axes -->
  <line x1="100" y1="105" x2="100" y2="390" stroke="#6b7280" stroke-width="1"/>
  <line x1="100" y1="390" x2="838" y2="390" stroke="#6b7280" stroke-width="1"/>
  <path d="M 838 390 l -7 -3.2 l 0 6.4 z" fill="#6b7280"/>

  <!-- y ticks / labels -->
  <text x="90" y="393.6" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <text x="90" y="322.35" text-anchor="end" font-size="12" fill="#6b7280">25%</text>
  <text x="90" y="251.10" text-anchor="end" font-size="12" fill="#6b7280">50%</text>
  <text x="90" y="179.85" text-anchor="end" font-size="12" fill="#6b7280">75%</text>
  <text x="90" y="108.60" text-anchor="end" font-size="12" fill="#6b7280">100%</text>

  <!-- x ticks / labels -->
  <line x1="100" y1="390" x2="100" y2="395" stroke="#6b7280" stroke-width="1"/>
  <line x1="265.91" y1="390" x2="265.91" y2="395" stroke="#6b7280" stroke-width="1"/>
  <line x1="431.82" y1="390" x2="431.82" y2="395" stroke="#6b7280" stroke-width="1"/>
  <line x1="597.73" y1="390" x2="597.73" y2="395" stroke="#6b7280" stroke-width="1"/>
  <line x1="763.64" y1="390" x2="763.64" y2="395" stroke="#6b7280" stroke-width="1"/>
  <text x="100" y="407" text-anchor="middle" font-size="11.5" fill="#6b7280">0</text>
  <text x="265.91" y="407" text-anchor="middle" font-size="11.5" fill="#6b7280">250</text>
  <text x="431.82" y="407" text-anchor="middle" font-size="11.5" fill="#6b7280">500</text>
  <text x="597.73" y="407" text-anchor="middle" font-size="11.5" fill="#6b7280">750</text>
  <text x="763.64" y="407" text-anchor="middle" font-size="11.5" fill="#6b7280">1,000</text>

  <!-- axis titles -->
  <text x="465" y="426" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3f4650">Transaction value ($ millions)</text>
  <text x="52" y="247.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3f4650"
        transform="rotate(-90 52 247.5)">Premerger notification rate</text>

  <!-- HSR threshold reference line -->
  <line x1="166.36" y1="105" x2="166.36" y2="390" stroke="#6b7280" stroke-width="1.4"
        stroke-dasharray="5,4"/>
  <text x="160" y="360" text-anchor="start" font-size="11.5" font-weight="600" fill="#6b7280"
        transform="rotate(-90 160 360)">HSR reporting threshold</text>

  <!-- curves -->
  <path fill="none" stroke="#00356b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
        d="M 100.00 382.88 C 111.06 382.40 150.88 389.29 166.36 380.02 C 181.85 370.76 181.85 348.44 192.91 327.30 C 203.97 306.16 217.24 276.95 232.73 253.20 C 248.21 229.45 263.70 203.80 285.82 184.80 C 307.94 165.80 335.59 149.65 365.45 139.20 C 395.32 128.75 426.29 126.38 465.00 122.10 C 503.71 117.83 547.95 115.69 597.73 113.55 C 647.50 111.41 724.92 110.08 763.64 109.27 C 802.35 108.47 818.94 108.80 830.00 108.70"/>
  <path fill="none" stroke="#1d63d8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
        d="M 100.00 385.73 C 111.06 385.25 150.88 386.44 166.36 382.88 C 181.85 379.31 181.85 372.66 192.91 364.35 C 203.97 356.04 217.24 346.77 232.73 333.00 C 248.21 319.23 263.70 298.80 285.82 281.70 C 307.94 264.60 335.59 246.55 365.45 230.40 C 395.32 214.25 426.29 198.10 465.00 184.80 C 503.71 171.50 547.95 160.10 597.73 150.60 C 647.50 141.10 724.92 132.08 763.64 127.80 C 802.35 123.53 818.94 125.42 830.00 124.95"/>

  <!-- gap indicator: double-headed arrow between the curves at ~ v=300 -->
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#3f4650"/>
    </marker>
  </defs>
  <line x1="299.09" y1="181" x2="299.09" y2="262" stroke="#3f4650" stroke-width="1.3"
        marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- gap annotation (required wording) with leader -->
  <path d="M 470 168 C 400 178 340 195 312 224" fill="none" stroke="#3f4650" stroke-width="1"
        marker-end="url(#ah)"/>
  <text x="476" y="150" text-anchor="start" font-size="13" fill="#3f4650">
    <tspan font-weight="700">PE-backed deals reported</tspan>
    <tspan x="476" dy="17"><tspan font-weight="700" fill="#1d63d8">&#8805;25 pp</tspan> less often</tspan>
  </text>

  <!-- legend (lower-right, empty region) -->
  <rect x="592" y="316" width="232" height="66" rx="4" fill="#ffffff" stroke="#e7e9ec" stroke-width="1"/>
  <line x1="606" y1="340" x2="640" y2="340" stroke="#00356b" stroke-width="3.2" stroke-linecap="round"/>
  <text x="650" y="344" font-size="13" fill="#3f4650">All deals</text>
  <line x1="606" y1="366" x2="640" y2="366" stroke="#1d63d8" stroke-width="3.2" stroke-linecap="round"/>
  <text x="650" y="370" font-size="13" fill="#3f4650">PE-backed deals</text>

  <!-- ===== STAT CALLOUT ===== -->
  <rect x="100" y="446" width="738" height="72" rx="6" fill="#f8f9fa" stroke="#e7e9ec" stroke-width="1"/>
  <text x="205" y="497" text-anchor="middle" font-size="44" font-weight="700" fill="#1d63d8">&#8776;90%</text>
  <line x1="312" y1="460" x2="312" y2="504" stroke="#e7e9ec" stroke-width="1"/>
  <text x="332" y="483" font-size="15" font-weight="600" fill="#3f4650">decline in antitrust enforcement</text>
  <text x="332" y="505" font-size="15" fill="#3f4650">for deals exempt from HSR notification<tspan fill="#6b7280" font-size="12.5">  (Section III)</tspan></text>

  <!-- ===== FOOTNOTE ===== -->
  <text x="100" y="540" font-size="11" fill="#6b7280">
    <tspan x="100" dy="0">Notification-rate curves illustrate the pattern documented in Section V: rates near zero below the reporting threshold, rising sharply above it, and</tspan>
    <tspan x="100" dy="15">&#8805;25 pp lower for PE-backed deals in the $100M&#8211;$500M range. The &#8805;25-point gap and the &#8776;90% enforcement figure are the paper&#8217;s reported</tspan>
    <tspan x="100" dy="15">magnitudes; the curves are a schematic of the described pattern, not measured point data.</tspan>
  </text>
</svg>
