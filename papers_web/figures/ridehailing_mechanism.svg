<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title-text { font-size: 20px; font-weight: 600; fill: #00356b; }
      .subtitle-text { font-size: 14px; font-weight: 500; fill: #3f4650; }
      .body-text { font-size: 12px; fill: #3f4650; }
      .label-text { font-size: 13px; fill: #00356b; font-weight: 600; }
      .note-text { font-size: 11px; fill: #6b7280; }
      .arrow-line { stroke: #1a4f8a; stroke-width: 2.5; fill: none; }
      .benefit-arrow { stroke: #6f9bcc; stroke-width: 2.5; fill: none; stroke-dasharray: 5,3; }
      .arrowhead { fill: #1a4f8a; }
      .benefit-arrowhead { fill: #6f9bcc; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="arrowhead"/>
    </marker>
    <marker id="benefit-arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="benefit-arrowhead"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#ffffff" stroke="none"/>

  <!-- Main Title -->
  <text x="450" y="30" class="title-text" text-anchor="middle">Mechanism: How Ridehailing Increases Traffic Fatalities</text>

  <!-- LEFT SIDE: SHOCK / ENTRY -->
  <g id="entry-box">
    <rect x="20" y="70" width="150" height="80" fill="#f8f9fa" stroke="#00356b" stroke-width="2.5" rx="6"/>
    <text x="95" y="95" class="label-text" text-anchor="middle">Ridehailing</text>
    <text x="95" y="115" class="label-text" text-anchor="middle">Entry</text>
    <text x="95" y="135" class="body-text" text-anchor="middle" font-size="10">(Uber / Lyft)</text>
  </g>

  <!-- Mechanism 1: VMT Channel -->
  <g id="vmt-channel">
    <path d="M 170 90 L 250 120" class="arrow-line" marker-end="url(#arrowhead)"/>
    <rect x="250" y="70" width="150" height="80" fill="#f8f9fa" stroke="#1a4f8a" stroke-width="2" rx="6"/>
    <text x="325" y="95" class="label-text" text-anchor="middle">Vehicle Miles</text>
    <text x="325" y="115" class="label-text" text-anchor="middle">Traveled (VMT)</text>
    <text x="325" y="135" class="body-text" text-anchor="middle" font-size="10">&#8593; Increases</text>

    <g id="vmt-detail">
      <rect x="250" y="160" width="150" height="80" fill="#f8f9fa" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
      <text x="325" y="178" class="subtitle-text" text-anchor="middle" font-size="11">Why VMT rises:</text>
      <text x="258" y="200" class="body-text">&#8226; Drivers cruise for</text>
      <text x="265" y="214" class="body-text">fares between rides</text>
      <text x="258" y="228" class="body-text">&#8226; Substitution from</text>
      <text x="265" y="242" class="body-text">transit / walking</text>
    </g>
  </g>

  <!-- Mechanism 2: Congestion Channel -->
  <g id="congestion-channel">
    <path d="M 170 110 L 520 140" class="arrow-line" marker-end="url(#arrowhead)"/>
    <rect x="520" y="70" width="150" height="80" fill="#f8f9fa" stroke="#1a4f8a" stroke-width="2" rx="6"/>
    <text x="595" y="95" class="label-text" text-anchor="middle">Traffic</text>
    <text x="595" y="115" class="label-text" text-anchor="middle">Congestion</text>
    <text x="595" y="135" class="body-text" text-anchor="middle" font-size="10">&#8593; Worsens</text>

    <g id="congestion-detail">
      <rect x="520" y="160" width="150" height="80" fill="#f8f9fa" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2" rx="4"/>
      <text x="595" y="178" class="subtitle-text" text-anchor="middle" font-size="11">Network effects:</text>
      <text x="528" y="200" class="body-text">&#8226; More vehicles on</text>
      <text x="535" y="214" class="body-text">roads, slower speeds</text>
      <text x="528" y="228" class="body-text">&#8226; New car</text>
      <text x="535" y="242" class="body-text">registrations rise ~3%</text>
    </g>
  </g>

  <!-- Mechanism 3: Driver-quality Channel -->
  <g id="behavioral-channel">
    <path d="M 170 130 L 790 140" class="arrow-line" marker-end="url(#arrowhead)"/>
    <rect x="790" y="70" width="90" height="80" fill="#f8f9fa" stroke="#1a4f8a" stroke-width="2" rx="6"/>
    <text x="835" y="95" class="label-text" text-anchor="middle" font-size="12">Driver</text>
    <text x="835" y="115" class="label-text" text-anchor="middle" font-size="12">Quality</text>
    <text x="835" y="135" class="body-text" text-anchor="middle" font-size="10">&#8595; Falls</text>
  </g>

  <!-- Mediating channels to fatalities -->
  <path d="M 325 250 L 360 280" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="335" y="265" class="note-text" fill="#1a4f8a">&#8593; Exposure</text>

  <path d="M 595 250 L 560 280" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="575" y="265" class="note-text" fill="#1a4f8a">&#8595; Speed</text>

  <path d="M 835 150 L 505 280" class="arrow-line" marker-end="url(#arrowhead)"/>
  <text x="675" y="215" class="note-text" fill="#1a4f8a">Distraction, phone use</text>

  <!-- OUTCOME BOX -->
  <g id="outcome">
    <rect x="350" y="290" width="180" height="90" fill="#eef3fb" stroke="#1d63d8" stroke-width="2.5" rx="6"/>
    <text x="440" y="318" class="label-text" text-anchor="middle" font-size="14">Traffic Fatalities</text>
    <text x="440" y="338" class="label-text" text-anchor="middle" font-size="14">&#8593; ~3.6%</text>
    <text x="440" y="355" class="body-text" text-anchor="middle" font-size="11">(2%&#8211;4% range)</text>
    <text x="440" y="372" class="body-text" text-anchor="middle" font-size="11">$5.33B&#8211;$13.24B / year</text>
  </g>

  <!-- COUNTERVAILING BENEFIT -->
  <g id="benefit-channel">
    <path d="M 170 110 Q 100 150 95 280" class="benefit-arrow" marker-end="url(#benefit-arrowhead)"/>
    <rect x="20" y="280" width="140" height="80" fill="#f8f9fa" stroke="#6f9bcc" stroke-width="1.5" stroke-dasharray="3,2" rx="4"/>
    <text x="90" y="305" class="body-text" text-anchor="middle" font-weight="600">Partial offset:</text>
    <text x="90" y="325" class="body-text" text-anchor="middle" font-size="11">&#8595; Drunk driving</text>
    <text x="90" y="345" class="note-text" text-anchor="middle" font-size="10">(does not reverse</text>
    <text x="90" y="358" class="note-text" text-anchor="middle" font-size="10">the net increase)</text>
  </g>

  <!-- Bottom Note -->
  <rect x="20" y="400" width="860" height="60" fill="#f8f9fa" stroke="#e7e9ec" stroke-width="1" rx="4"/>
  <text x="450" y="420" class="subtitle-text" text-anchor="middle" font-size="12" font-weight="600">Key Finding</text>
  <text x="450" y="440" class="body-text" text-anchor="middle" font-size="11">Increased VMT and congestion, together with lower average driver quality, dominate any reduction in drunk driving,</text>
  <text x="450" y="455" class="body-text" text-anchor="middle" font-size="11">producing a net increase in fatalities that persists across weekdays, weekends, and nights (weekend nights lowest).</text>
</svg>
