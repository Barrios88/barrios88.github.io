<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 23px; font-weight: 600; fill: #00356b; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .panel-head { font-size: 14.5px; font-weight: 600; fill: #00356b; }
      .panel-sub { font-size: 12px; fill: #6b7280; }
      .label { font-size: 13px; fill: #3f4650; }
      .value { font-size: 13px; font-weight: 600; fill: #00356b; }
      .axis { font-size: 11px; fill: #6b7280; }
      .note { font-size: 11.5px; fill: #6b7280; }
    </style>
    <filter id="softshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="50" y="38" class="title">Determinants of Foreign Director Appointments</text>
  <text x="50" y="60" class="subtitle">Gravity model &#8212; 38 countries, 169,472 directors, 26,940 boards, 2000&#8211;2013</text>

  <!-- ============ PANEL A: COEFFICIENTS ============ -->
  <rect x="40" y="90" width="445" height="420" fill="#ffffff" stroke="#e7e9ec" stroke-width="1.5" rx="4"/>
  <text x="62" y="120" class="panel-head">Gravity-model coefficients (PPML)</text>
  <text x="62" y="139" class="panel-sub">Country-pair homophily and gravity terms</text>

  <!-- zero axis -->
  <line x1="250" y1="158" x2="250" y2="418" stroke="#c9ccd1" stroke-width="1.2"/>
  <text x="250" y="437" class="axis" text-anchor="middle">0</text>

  <!-- Row 1: Cultural & institutional proximity  +0.20 (85px) -->
  <text x="62" y="177" class="label">Cultural &amp; institutional proximity</text>
  <rect x="250" y="185" width="85" height="30" fill="#1a4f8a" rx="2" filter="url(#softshadow)"/>
  <text x="343" y="205" class="value">+0.20***</text>

  <!-- Row 2: Colonial ties  +0.30 (127.5px) -->
  <text x="62" y="257" class="label">Colonial ties</text>
  <rect x="250" y="265" width="127" height="30" fill="#1a4f8a" rx="2" filter="url(#softshadow)"/>
  <text x="386" y="285" class="value">+0.30***</text>

  <!-- Row 3: Geographic distance  -0.33 (140px, negative) -->
  <text x="62" y="337" class="label">Geographic distance</text>
  <rect x="110" y="345" width="140" height="30" fill="#1d63d8" rx="2" filter="url(#softshadow)"/>
  <text x="104" y="365" class="value" text-anchor="end">&#8722;0.33***</text>

  <!-- Panel A caption -->
  <text x="62" y="470" class="note">Coefficients are log points; e^0.20 &#8776; 1.22, i.e. about 22% more</text>
  <text x="62" y="487" class="note">foreign directors per one-standard-deviation rise in cultural proximity.</text>

  <!-- ============ PANEL B: ECONOMIC MAGNITUDE ============ -->
  <rect x="515" y="90" width="445" height="420" fill="#ffffff" stroke="#e7e9ec" stroke-width="1.5" rx="4"/>
  <text x="537" y="120" class="panel-head">Economic magnitude of a 1 SD change</text>
  <text x="537" y="139" class="panel-sub">Share of the standard deviation of foreign directors</text>

  <!-- gridlines: 0..50% at x = 535 + pct*6.8 -->
  <g stroke="#e7e9ec" stroke-width="1">
    <line x1="535" y1="158" x2="535" y2="378"/>
    <line x1="603" y1="158" x2="603" y2="378"/>
    <line x1="671" y1="158" x2="671" y2="378"/>
    <line x1="739" y1="158" x2="739" y2="378"/>
    <line x1="807" y1="158" x2="807" y2="378"/>
    <line x1="875" y1="158" x2="875" y2="378"/>
  </g>
  <g class="axis" text-anchor="middle">
    <text x="535" y="394">0</text>
    <text x="603" y="394">10</text>
    <text x="671" y="394">20</text>
    <text x="739" y="394">30</text>
    <text x="807" y="394">40</text>
    <text x="875" y="394">50%</text>
  </g>

  <!-- Row 1: GDP (dominant) 43.7% -> 297px -->
  <text x="537" y="177" class="label">Economic size &#8212; GDP (both countries)</text>
  <rect x="535" y="185" width="297" height="30" fill="#00356b" rx="2" filter="url(#softshadow)"/>
  <text x="840" y="205" class="value">43.7%</text>

  <!-- Row 2: Homophily 8.8% -> 60px -->
  <text x="537" y="257" class="label">Country-pair homophily (both factors)</text>
  <rect x="535" y="265" width="60" height="30" fill="#1a4f8a" rx="2" filter="url(#softshadow)"/>
  <text x="603" y="285" class="value">8.8%</text>

  <!-- Row 3: Geography 8.0% -> 54px -->
  <text x="537" y="337" class="label">Geographic factors (distance + border)</text>
  <rect x="535" y="345" width="54" height="30" fill="#6f9bcc" rx="2" filter="url(#softshadow)"/>
  <text x="597" y="365" class="value">8.0%</text>

  <!-- Panel B note -->
  <text x="537" y="430" class="note">GDP is the dominant factor. Country-pair homophily is about</text>
  <text x="537" y="447" class="note">20% of the GDP effect (8.8% / 43.7%) and similar in magnitude</text>
  <text x="537" y="464" class="note">to geography.</text>

  <!-- ============ FOOTER ============ -->
  <text x="50" y="548" class="note">Sample: 169,472 directors, 26,940 boards, 38 countries, 2000&#8211;2013. Estimation: Poisson pseudo-maximum likelihood.</text>
  <text x="50" y="570" class="note">Controls: GDP destination, GDP origin, geographic distance, contiguous border; origin, destination, and year fixed effects. *** p &lt; 0.01.</text>
</svg>
