<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 19px; font-weight: 600; fill: #00356b; }
      .box-title { font-size: 13.5px; font-weight: 600; fill: #1a4f8a; }
      .box-text { font-size: 11.5px; fill: #3f4650; }
      .arrow-text { font-size: 10.5px; fill: #6b7280; font-style: italic; }
      .note { font-size: 11px; fill: #6b7280; font-style: italic; }
    </style>
    <filter id="dropshadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1a4f8a"/>
    </marker>
    <marker id="ah-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1d63d8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="34" class="title" text-anchor="middle">How Country-Pair Homophily Shapes Foreign Director Appointments</text>

  <!-- ===== SUPPLY (left) ===== -->
  <rect x="40" y="75" width="190" height="110" rx="4" fill="#ffffff" stroke="#1a4f8a" stroke-width="1.8" filter="url(#dropshadow)"/>
  <text x="55" y="98" class="box-title">Supply of Directors</text>
  <text x="55" y="122" class="box-text">&#8226; Director networks</text>
  <text x="55" y="140" class="box-text">&#8226; International mobility</text>
  <text x="55" y="158" class="box-text">&#8226; Home-country background</text>

  <!-- ===== DEMAND (right) ===== -->
  <rect x="670" y="75" width="190" height="110" rx="4" fill="#ffffff" stroke="#1a4f8a" stroke-width="1.8" filter="url(#dropshadow)"/>
  <text x="685" y="98" class="box-title">Demand from Firms</text>
  <text x="685" y="122" class="box-text">&#8226; Board expertise needs</text>
  <text x="685" y="140" class="box-text">&#8226; Familiarity &amp; trust</text>
  <text x="685" y="158" class="box-text">&#8226; Governance fit</text>

  <!-- ===== CENTRAL HUB ===== -->
  <rect x="350" y="65" width="200" height="130" rx="6" fill="#00356b" stroke="#00356b" stroke-width="2" filter="url(#dropshadow)"/>
  <text x="450" y="98" text-anchor="middle" style="font-size: 15px; font-weight: 600; fill: #ffffff;">Country-Pair</text>
  <text x="450" y="118" text-anchor="middle" style="font-size: 15px; font-weight: 600; fill: #ffffff;">Homophily</text>
  <text x="450" y="145" text-anchor="middle" style="font-size: 11px; fill: #dbe6f2;">Cultural &amp; institutional proximity;</text>
  <text x="450" y="161" text-anchor="middle" style="font-size: 11px; fill: #dbe6f2;">Colonial ties</text>
  <text x="450" y="180" text-anchor="middle" style="font-size: 9.5px; fill: #a9c1de;">Language, legal origin, religion, colonial history</text>

  <!-- Supply -> hub -->
  <text x="289" y="116" class="arrow-text" text-anchor="middle">similar-country directors</text>
  <line x1="230" y1="130" x2="348" y2="130" stroke="#1a4f8a" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Demand -> hub -->
  <text x="611" y="116" class="arrow-text" text-anchor="middle">familiar, trusted profiles</text>
  <line x1="670" y1="130" x2="552" y2="130" stroke="#1a4f8a" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Hub -> Appointments outcome -->
  <line x1="450" y1="197" x2="450" y2="233" stroke="#1a4f8a" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- ===== APPOINTMENTS OUTCOME ===== -->
  <rect x="250" y="235" width="400" height="92" rx="6" fill="#eef3fa" stroke="#1a4f8a" stroke-width="1.8" filter="url(#dropshadow)"/>
  <text x="450" y="260" text-anchor="middle" style="font-size: 14px; font-weight: 600; fill: #00356b;">Homophily in Appointments</text>
  <text x="450" y="282" text-anchor="middle" class="box-text">Directors appointed from culturally and institutionally</text>
  <text x="450" y="298" text-anchor="middle" class="box-text">similar countries at higher rates</text>
  <text x="450" y="318" text-anchor="middle" style="font-size: 12px; font-weight: 600; fill: #1d63d8;">1 SD in cultural proximity &#8776; 22% more foreign directors</text>

  <!-- Appointments -> Governance gap -->
  <line x1="450" y1="327" x2="450" y2="363" stroke="#1d63d8" stroke-width="2.5" marker-end="url(#ah-accent)"/>

  <!-- ===== GOVERNANCE GAP ===== -->
  <rect x="250" y="365" width="400" height="86" rx="6" fill="#ffffff" stroke="#1d63d8" stroke-width="1.8" filter="url(#dropshadow)"/>
  <text x="450" y="388" text-anchor="middle" style="font-size: 14px; font-weight: 600; fill: #1d63d8;">Governance Gap</text>
  <text x="450" y="410" text-anchor="middle" class="box-text">Homophily limits appointments of directors from high-governance</text>
  <text x="450" y="426" text-anchor="middle" class="box-text">countries to firms in low-governance countries, potentially slowing</text>
  <text x="450" y="442" text-anchor="middle" class="box-text">the global convergence of governance.</text>

  <!-- Bottom note -->
  <text x="450" y="480" class="note" text-anchor="middle">Economic size (GDP) remains the dominant force; country-pair homophily adds about 20% on top, net of the gravity controls.</text>
</svg>
