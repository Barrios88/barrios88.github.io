<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <!-- Define styles -->
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 600; fill: #00356b; }
      .box-title { font-size: 13.5px; font-weight: 600; fill: #00356b; }
      .box-title-out { font-size: 13.5px; font-weight: 600; fill: #1d63d8; }
      .box-text { font-size: 12px; fill: #3f4650; }
      .arrow-text { font-size: 10px; fill: #6b7280; font-style: italic; }
      .connection-line { stroke: #1a4f8a; stroke-width: 2; fill: none; }
      .arrow-head { fill: #1a4f8a; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="arrow-head"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#ffffff" stroke="none"/>

  <!-- Title -->
  <text x="450" y="30" class="title" text-anchor="middle">Civic Capital and Pandemic Responses: The Causal Mechanism</text>

  <!-- ============ LEFT COLUMN: CIVIC CAPITAL MEASURES ============ -->

  <!-- Voter Turnout Box -->
  <rect x="20" y="70" width="140" height="100" fill="#ffffff" stroke="#00356b" stroke-width="2" rx="2"/>
  <text x="35" y="91" class="box-title">Voter Turnout</text>
  <text x="35" y="111" class="box-text">Historical</text>
  <text x="35" y="127" class="box-text">participation in</text>
  <text x="35" y="143" class="box-text">presidential</text>
  <text x="35" y="159" class="box-text">elections</text>

  <!-- Census Response Rate Box -->
  <rect x="20" y="190" width="140" height="100" fill="#ffffff" stroke="#00356b" stroke-width="2" rx="2"/>
  <text x="35" y="211" class="box-title">Census</text>
  <text x="35" y="227" class="box-title">Response</text>
  <text x="35" y="248" class="box-text">Mail-in response</text>
  <text x="35" y="264" class="box-text">rates to decennial</text>
  <text x="35" y="280" class="box-text">census</text>

  <!-- Community Orgs Box -->
  <rect x="20" y="310" width="140" height="100" fill="#ffffff" stroke="#00356b" stroke-width="2" rx="2"/>
  <text x="35" y="331" class="box-title">Community</text>
  <text x="35" y="347" class="box-title">Organizations</text>
  <text x="35" y="368" class="box-text">Density of civic,</text>
  <text x="35" y="384" class="box-text">business, and</text>
  <text x="35" y="400" class="box-text">non-profit orgs</text>

  <!-- ============ MIDDLE COLUMN: CIVIC CAPITAL AGGREGATE ============ -->

  <!-- Civic Capital Synthesis Box -->
  <rect x="220" y="150" width="200" height="180" fill="#1a4f8a" stroke="#00356b" stroke-width="2" rx="3"/>
  <text x="320" y="177" class="title" text-anchor="middle" fill="#ffffff">Civic Capital</text>
  <text x="320" y="202" style="font-size: 11.5px; fill: #ffffff; text-anchor: middle;">
    <tspan x="320" dy="0">Aggregate of shared values,</tspan>
    <tspan x="320" dy="15">norms of reciprocity, and</tspan>
    <tspan x="320" dy="15">capacity for collective action</tspan>
  </text>
  <text x="320" y="262" style="font-size: 10.5px; fill: #dbe6f2; text-anchor: middle; font-style: italic;">
    <tspan x="320" dy="0">Values + Beliefs that help</tspan>
    <tspan x="320" dy="13">overcome free-rider problem</tspan>
  </text>

  <!-- Arrows from civic measures to aggregate -->
  <path d="M 160 120 L 220 200" class="connection-line" marker-end="url(#arrowhead)"/>
  <path d="M 160 240 L 220 240" class="connection-line" marker-end="url(#arrowhead)"/>
  <path d="M 160 360 L 220 280" class="connection-line" marker-end="url(#arrowhead)"/>

  <!-- ============ RIGHT COLUMN: BEHAVIORAL OUTCOMES ============ -->

  <!-- Social Distancing Box -->
  <rect x="560" y="70" width="150" height="110" fill="#ffffff" stroke="#1d63d8" stroke-width="2" rx="2"/>
  <text x="575" y="96" class="box-title-out">&#8595; Mobility</text>
  <text x="575" y="117" class="box-text">Greater reduction</text>
  <text x="575" y="133" class="box-text">in distance</text>
  <text x="575" y="149" class="box-text">traveled and</text>
  <text x="575" y="165" class="box-text">retail visits</text>

  <!-- Mask Wearing Box -->
  <rect x="560" y="210" width="150" height="110" fill="#ffffff" stroke="#1d63d8" stroke-width="2" rx="2"/>
  <text x="575" y="234" class="box-title-out">&#8593; Protective</text>
  <text x="575" y="250" class="box-title-out">Behaviors</text>
  <text x="575" y="270" class="box-text">Higher mask</text>
  <text x="575" y="285" class="box-text">usage rates,</text>
  <text x="575" y="300" class="box-text">fewer social</text>
  <text x="575" y="315" class="box-text">contacts</text>

  <!-- Sustained Compliance Box -->
  <rect x="560" y="350" width="150" height="110" fill="#ffffff" stroke="#1d63d8" stroke-width="2" rx="2"/>
  <text x="575" y="374" class="box-title-out">&#8593; Sustained</text>
  <text x="575" y="390" class="box-title-out">Compliance</text>
  <text x="575" y="410" class="box-text">Maintained</text>
  <text x="575" y="425" class="box-text">distancing even</text>
  <text x="575" y="440" class="box-text">after restrictions</text>
  <text x="575" y="455" class="box-text">lifted</text>

  <!-- Arrows from civic capital to outcomes -->
  <path d="M 420 210 L 560 125" class="connection-line" marker-end="url(#arrowhead)"/>
  <path d="M 420 240 L 560 265" class="connection-line" marker-end="url(#arrowhead)"/>
  <path d="M 420 270 L 560 405" class="connection-line" marker-end="url(#arrowhead)"/>

  <!-- ============ BOTTOM MECHANISTIC PATHWAY ============ -->

  <!-- Mechanism boxes (centered under the hub, clear of the right column) -->
  <rect x="205" y="400" width="150" height="65" fill="#f8f9fa" stroke="#9aa1ab" stroke-width="1.5" stroke-dasharray="5,5" rx="2"/>
  <text x="280" y="421" style="font-size: 11.5px; font-weight: 600; fill: #3f4650; text-anchor: middle;">Mechanism 1:</text>
  <text x="280" y="438" style="font-size: 10.5px; fill: #3f4650; text-anchor: middle;">Internalize</text>
  <text x="280" y="452" style="font-size: 10.5px; fill: #3f4650; text-anchor: middle;">Externalities</text>

  <rect x="375" y="400" width="150" height="65" fill="#f8f9fa" stroke="#9aa1ab" stroke-width="1.5" stroke-dasharray="5,5" rx="2"/>
  <text x="450" y="421" style="font-size: 11.5px; font-weight: 600; fill: #3f4650; text-anchor: middle;">Mechanism 2:</text>
  <text x="450" y="438" style="font-size: 10.5px; fill: #3f4650; text-anchor: middle;">Expect Others to</text>
  <text x="450" y="452" style="font-size: 10.5px; fill: #3f4650; text-anchor: middle;">Comply Too</text>

  <!-- Connecting lines from civic capital to mechanisms -->
  <line x1="320" y1="335" x2="280" y2="400" class="connection-line" stroke-dasharray="3,3"/>
  <line x1="320" y1="335" x2="450" y2="400" class="connection-line" stroke-dasharray="3,3"/>

  <!-- Bottom explanatory text -->
  <text x="450" y="477" style="font-size: 9px; fill: #6b7280; text-anchor: middle; font-style: italic;">
    Civic Capital enables voluntary compliance through shared values and mutual expectations of cooperation
  </text>

</svg>
