<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: 700; fill: #00356b; }
      .box-title { font-size: 14px; font-weight: 600; fill: #00356b; }
      .box-text { font-size: 11px; fill: #3f4650; }
      .arrow-label { font-size: 10px; fill: #1d63d8; font-weight: 600; }
      .outcome-label { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .outcome-text { font-size: 11px; fill: #ffffff; }
      .legend-text { font-size: 11px; fill: #3f4650; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1d63d8"/>
    </marker>
    <marker id="arrowhead-navy" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1a4f8a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" class="title">How Conflicts Reduce Research Credibility</text>

  <!-- LEFT COLUMN: CONFLICT TYPES -->
  <g>
    <!-- Monetary -->
    <rect x="20" y="60" width="170" height="85" fill="#ffffff" stroke="#1a4f8a" stroke-width="2" rx="4"/>
    <text x="105" y="82" text-anchor="middle" class="box-title">Monetary</text>
    <text x="105" y="100" text-anchor="middle" class="box-text">Financial interest in</text>
    <text x="105" y="114" text-anchor="middle" class="box-text">the research outcome</text>
    <text x="105" y="136" text-anchor="middle" class="box-text" font-weight="700" fill="#1a4f8a">27% Trust Reduction</text>

    <!-- Data-Access -->
    <rect x="20" y="160" width="170" height="85" fill="#ffffff" stroke="#00356b" stroke-width="2" rx="4"/>
    <text x="105" y="182" text-anchor="middle" class="box-title">Data-Access</text>
    <text x="105" y="200" text-anchor="middle" class="box-text">Proprietary or gated</text>
    <text x="105" y="214" text-anchor="middle" class="box-text">data with review rights</text>
    <text x="105" y="236" text-anchor="middle" class="box-text" font-weight="700" fill="#00356b">20&#8211;52% Trust Reduction</text>

    <!-- Ideological -->
    <rect x="20" y="260" width="170" height="85" fill="#ffffff" stroke="#1d63d8" stroke-width="2" rx="4"/>
    <text x="105" y="282" text-anchor="middle" class="box-title">Ideological</text>
    <text x="105" y="300" text-anchor="middle" class="box-text">Political / partisan stake</text>
    <text x="105" y="314" text-anchor="middle" class="box-text">in research findings</text>
    <text x="105" y="336" text-anchor="middle" class="box-text" font-weight="700" fill="#1d63d8">17% Trust Reduction</text>

    <!-- Academic -->
    <rect x="20" y="360" width="170" height="85" fill="#ffffff" stroke="#6f9bcc" stroke-width="2" rx="4"/>
    <text x="105" y="382" text-anchor="middle" class="box-title">Academic</text>
    <text x="105" y="400" text-anchor="middle" class="box-text">History of publications</text>
    <text x="105" y="414" text-anchor="middle" class="box-text">in a given direction</text>
    <text x="105" y="436" text-anchor="middle" class="box-text" font-weight="700" fill="#6f9bcc">13% Trust Reduction</text>
  </g>

  <!-- CENTER COLUMN: MECHANISM -->
  <g>
    <rect x="250" y="120" width="180" height="255" fill="#f8f9fa" stroke="#00356b" stroke-width="2" rx="4" opacity="0.7"/>

    <!-- Conflict disclosed -->
    <rect x="268" y="140" width="144" height="52" fill="#ffffff" stroke="#00356b" stroke-width="1.5" rx="3"/>
    <text x="340" y="162" text-anchor="middle" class="box-title" font-size="13">Conflict Disclosed</text>
    <text x="340" y="180" text-anchor="middle" class="box-text">Audience learns of stake</text>

    <path d="M 340 192 L 340 213" stroke="#1d63d8" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Credibility assessment -->
    <rect x="268" y="215" width="144" height="52" fill="#ffffff" stroke="#00356b" stroke-width="1.5" rx="3"/>
    <text x="340" y="237" text-anchor="middle" class="box-title" font-size="13">Credibility Assessment</text>
    <text x="340" y="255" text-anchor="middle" class="box-text">Trust in findings reduced</text>

    <path d="M 340 267 L 340 288" stroke="#1d63d8" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Belief update -->
    <rect x="268" y="290" width="144" height="52" fill="#ffffff" stroke="#00356b" stroke-width="1.5" rx="3"/>
    <text x="340" y="312" text-anchor="middle" class="box-title" font-size="13">Belief Update</text>
    <text x="340" y="330" text-anchor="middle" class="box-text">Downweight the findings</text>
  </g>

  <!-- RIGHT COLUMN: OUTCOMES -->
  <g>
    <!-- Lower value -->
    <rect x="500" y="90" width="180" height="90" fill="#00356b" rx="4"/>
    <text x="590" y="118" text-anchor="middle" class="outcome-label">39% Lower Value</text>
    <text x="590" y="140" text-anchor="middle" class="outcome-text">Conflicted paper worth 39%</text>
    <text x="590" y="156" text-anchor="middle" class="outcome-text">less than non-conflicted</text>

    <!-- Reduced influence -->
    <rect x="500" y="205" width="180" height="90" fill="#1a4f8a" rx="4"/>
    <text x="590" y="233" text-anchor="middle" class="outcome-label">Reduced Influence</text>
    <text x="590" y="255" text-anchor="middle" class="outcome-text">Ideas reach fewer people</text>
    <text x="590" y="271" text-anchor="middle" class="outcome-text">in policy &amp; debate</text>

    <!-- Market access -->
    <rect x="500" y="320" width="180" height="90" fill="#1d63d8" rx="4"/>
    <text x="590" y="348" text-anchor="middle" class="outcome-label">Market Access</text>
    <text x="590" y="370" text-anchor="middle" class="outcome-text">Conflicted researchers are</text>
    <text x="590" y="386" text-anchor="middle" class="outcome-text">less effective advocates</text>
  </g>

  <!-- ARROWS: conflict types -> mechanism -->
  <g>
    <path d="M 190 102 Q 222 150 250 175" stroke="#1a4f8a" stroke-width="2" fill="none" marker-end="url(#arrowhead-navy)" opacity="0.7"/>
    <path d="M 190 202 Q 222 215 250 225" stroke="#00356b" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-navy)"/>
    <text x="210" y="205" class="arrow-label" fill="#00356b">Largest</text>
    <path d="M 190 302 Q 222 290 250 275" stroke="#1d63d8" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
    <path d="M 190 402 Q 224 350 250 315" stroke="#6f9bcc" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>
  </g>

  <!-- ARROWS: mechanism -> outcomes -->
  <g>
    <path d="M 430 175 L 500 135" stroke="#1d63d8" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
    <text x="450" y="150" class="arrow-label">Reduces</text>
    <path d="M 430 248 L 500 250" stroke="#1d63d8" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
    <text x="450" y="242" class="arrow-label">Weakens</text>
    <path d="M 430 320 L 500 360" stroke="#1d63d8" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>
    <text x="450" y="352" class="arrow-label">Limits</text>
  </g>

  <!-- BOTTOM LEGEND -->
  <g>
    <rect x="20" y="475" width="660" height="70" fill="#ffffff" stroke="#e7e9ec" stroke-width="1" rx="3"/>
    <text x="40" y="500" class="legend-text" font-weight="700" fill="#00356b">Key mechanism:</text>
    <text x="40" y="520" class="legend-text">Disclosing a conflict activates skepticism; audiences reassess the author's credibility and downweight</text>
    <text x="40" y="536" class="legend-text">the findings&#8212;reducing trust by about 30% on average and lowering the assessed value of conflicted papers.</text>
  </g>

</svg>
