<svg viewBox="0 0 1000 660" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .chart-title { font-size: 24px; font-weight: 600; fill: #00356b; }
      .chart-subtitle { font-size: 13px; fill: #6b7280; }
      .axis-label { font-size: 12px; fill: #3f4650; }
      .axis-value { font-size: 11px; fill: #6b7280; }
      .cat-label { font-size: 13px; font-weight: 600; fill: #3f4650; }
      .cat-sub { font-size: 12px; fill: #6b7280; }
      .val-label { font-size: 18px; font-weight: 700; fill: #00356b; }
      .insight-title { font-size: 12px; font-weight: 700; fill: #00356b; }
      .insight-text { font-size: 12px; fill: #3f4650; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" class="chart-title">Conflict-of-Interest Trust Reduction by Type</text>
  <text x="500" y="63" text-anchor="middle" class="chart-subtitle">Average reduction in trust in research findings when a conflict is disclosed (randomized survey)</text>

  <!-- Axes -->
  <line x1="90" y1="100" x2="90" y2="520" stroke="#e7e9ec" stroke-width="1.5"/>
  <line x1="90" y1="520" x2="950" y2="520" stroke="#e7e9ec" stroke-width="1.5"/>

  <!-- Gridlines + y-axis labels -->
  <line x1="90" y1="520" x2="950" y2="520" stroke="#e7e9ec" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="78" y="524" text-anchor="end" class="axis-value">0%</text>
  <line x1="90" y1="460" x2="950" y2="460" stroke="#e7e9ec" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="78" y="464" text-anchor="end" class="axis-value">10%</text>
  <line x1="90" y1="400" x2="950" y2="400" stroke="#e7e9ec" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="78" y="404" text-anchor="end" class="axis-value">20%</text>
  <line x1="90" y1="340" x2="950" y2="340" stroke="#e7e9ec" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="78" y="344" text-anchor="end" class="axis-value">30%</text>
  <line x1="90" y1="280" x2="950" y2="280" stroke="#e7e9ec" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="78" y="284" text-anchor="end" class="axis-value">40%</text>
  <line x1="90" y1="220" x2="950" y2="220" stroke="#e7e9ec" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="78" y="224" text-anchor="end" class="axis-value">50%</text>
  <line x1="90" y1="160" x2="950" y2="160" stroke="#e7e9ec" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <text x="78" y="164" text-anchor="end" class="axis-value">60%</text>

  <!-- Y-axis label -->
  <text x="30" y="310" text-anchor="middle" class="axis-label" transform="rotate(-90 30 310)">CoI Trust Reduction</text>

  <!-- Bar 1: Data Access (Proprietary), 20-52% range -->
  <g>
    <rect x="170" y="208" width="120" height="192" fill="#00356b" rx="3"/>
    <text x="230" y="198" text-anchor="middle" class="val-label">20&#8211;52%</text>
    <text x="230" y="548" text-anchor="middle" class="cat-label">Data Access</text>
    <text x="230" y="565" text-anchor="middle" class="cat-sub">(Proprietary)</text>
  </g>

  <!-- Bar 2: Monetary Conflicts, 27% -->
  <g>
    <rect x="370" y="358" width="120" height="162" fill="#1a4f8a" rx="3"/>
    <text x="430" y="348" text-anchor="middle" class="val-label">27%</text>
    <text x="430" y="548" text-anchor="middle" class="cat-label">Monetary</text>
    <text x="430" y="565" text-anchor="middle" class="cat-sub">Conflicts</text>
  </g>

  <!-- Bar 3: Ideological (Political), 17% -->
  <g>
    <rect x="570" y="418" width="120" height="102" fill="#1d63d8" rx="3"/>
    <text x="630" y="408" text-anchor="middle" class="val-label">17%</text>
    <text x="630" y="548" text-anchor="middle" class="cat-label">Ideological</text>
    <text x="630" y="565" text-anchor="middle" class="cat-sub">(Political)</text>
  </g>

  <!-- Bar 4: Academic Conflicts, 13% -->
  <g>
    <rect x="770" y="442" width="120" height="78" fill="#6f9bcc" rx="3"/>
    <text x="830" y="432" text-anchor="middle" class="val-label">13%</text>
    <text x="830" y="548" text-anchor="middle" class="cat-label">Academic</text>
    <text x="830" y="565" text-anchor="middle" class="cat-sub">Conflicts</text>
  </g>

  <!-- Key insight box -->
  <rect x="100" y="590" width="800" height="58" fill="#f8f9fa" stroke="#00356b" stroke-width="1.5" rx="3"/>
  <text x="120" y="613" class="insight-title">Key Insight:</text>
  <text x="210" y="613" class="insight-text">Data-access conflicts show the largest trust reductions&#8212;up to 52% when the interested party retains data-review</text>
  <text x="120" y="632" class="insight-text">rights&#8212;while academic conflicts show the smallest (13%). Across conflict types, disclosure reduces trust by about 30% on average.</text>

</svg>
