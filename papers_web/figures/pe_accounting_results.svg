<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #00356b; }
      .subtitle { font-size: 14px; font-weight: 700; fill: #00356b; }
      .axis-label { font-size: 12px; fill: #6b7280; }
      .grid-line { stroke: #e7e9ec; stroke-width: 1; }
      .bar-label { font-size: 12px; fill: #3f4650; font-weight: 600; }
      .data-label { font-size: 12px; fill: #ffffff; font-weight: 700; }
      .accent { fill: #1d63d8; font-weight: 700; }
      .note { font-size: 11px; fill: #6b7280; font-style: italic; }
    </style>
    <marker id="arrow-accent" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#1d63d8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" class="title">Key Results: Private Equity in Accounting (1999&#8211;2024)</text>

  <!-- ============ Panel A: Cumulative PE transactions ============ -->
  <g id="panel-a">
    <text x="40" y="76" class="subtitle">Panel A: Cumulative PE Transactions</text>
    <rect x="40" y="86" width="520" height="285" fill="#ffffff" stroke="#e7e9ec" stroke-width="1.5" rx="4"/>
    <text x="26" y="230" class="axis-label" text-anchor="middle" transform="rotate(-90 26 230)">Cumulative PE Transactions</text>

    <!-- Grid lines -->
    <line x1="70" y1="340" x2="550" y2="340" class="grid-line"/>
    <line x1="70" y1="225" x2="550" y2="225" class="grid-line"/>
    <line x1="70" y1="110" x2="550" y2="110" class="grid-line"/>
    <!-- Y-axis labels -->
    <text x="65" y="344" text-anchor="end" class="axis-label">0</text>
    <text x="65" y="229" text-anchor="end" class="axis-label">1,800</text>
    <text x="65" y="114" text-anchor="end" class="axis-label">3,600+</text>
    <!-- Axes -->
    <line x1="70" y1="340" x2="70" y2="102" stroke="#c9ced6" stroke-width="1.5"/>
    <line x1="70" y1="340" x2="550" y2="340" stroke="#c9ced6" stroke-width="1.5"/>

    <!-- Cumulative area (illustrative shape: most growth accrues after 2020) -->
    <path d="M70,340 L185,332 L281,321 L377,299 L454,260 L473,244 L492,215 L512,180 L531,145 L550,110 L550,340 L70,340 Z"
          fill="#6f9bcc" fill-opacity="0.30"/>
    <path d="M70,340 L185,332 L281,321 L377,299 L454,260 L473,244 L492,215 L512,180 L531,145 L550,110"
          fill="none" stroke="#1d63d8" stroke-width="2.5"/>
    <circle cx="550" cy="110" r="5" fill="#1d63d8"/>

    <!-- Post-2020 acceleration marker -->
    <line x1="473" y1="340" x2="473" y2="150" stroke="#1d63d8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.55"/>
    <text x="466" y="150" text-anchor="end" class="accent" font-size="12">Sharp rise</text>
    <text x="466" y="165" text-anchor="end" class="accent" font-size="12">post-2020</text>
    <text x="545" y="98" text-anchor="end" class="accent" font-size="12">3,600+ total</text>

    <!-- X-axis year labels -->
    <text x="89" y="360" text-anchor="middle" class="axis-label">2000</text>
    <text x="320" y="360" text-anchor="middle" class="axis-label">2012</text>
    <text x="546" y="360" text-anchor="middle" class="axis-label">2024</text>
  </g>

  <!-- ============ Panel B: Non-audit revenue share ============ -->
  <g id="panel-b">
    <text x="620" y="76" class="subtitle">Panel B: Non-Audit Revenue Share</text>
    <rect x="620" y="86" width="520" height="285" fill="#ffffff" stroke="#e7e9ec" stroke-width="1.5" rx="4"/>
    <text x="606" y="230" class="axis-label" text-anchor="middle" transform="rotate(-90 606 230)">Non-Audit Revenue Share (%)</text>

    <!-- Grid lines: 0,25,50,75,100 at 2px/% (0%=340) -->
    <line x1="650" y1="340" x2="1120" y2="340" class="grid-line"/>
    <line x1="650" y1="290" x2="1120" y2="290" class="grid-line"/>
    <line x1="650" y1="240" x2="1120" y2="240" class="grid-line"/>
    <line x1="650" y1="190" x2="1120" y2="190" class="grid-line"/>
    <line x1="650" y1="140" x2="1120" y2="140" class="grid-line"/>
    <!-- Y-axis labels -->
    <text x="645" y="344" text-anchor="end" class="axis-label">0%</text>
    <text x="645" y="294" text-anchor="end" class="axis-label">25%</text>
    <text x="645" y="244" text-anchor="end" class="axis-label">50%</text>
    <text x="645" y="194" text-anchor="end" class="axis-label">75%</text>
    <text x="645" y="144" text-anchor="end" class="axis-label">100%</text>
    <!-- Axes -->
    <line x1="650" y1="340" x2="650" y2="130" stroke="#c9ced6" stroke-width="1.5"/>
    <line x1="650" y1="340" x2="1120" y2="340" stroke="#c9ced6" stroke-width="1.5"/>

    <!-- Before PE: 61% (h=122, top=218) -->
    <rect x="730" y="218" width="95" height="122" fill="#6f9bcc"/>
    <text x="777" y="210" text-anchor="middle" class="bar-label" fill="#00356b">61%</text>
    <text x="777" y="358" text-anchor="middle" class="axis-label">Before PE</text>

    <!-- After PE: 74.3% (h=149, top=191) -->
    <rect x="900" y="191" width="95" height="149" fill="#1d63d8"/>
    <text x="947" y="183" text-anchor="middle" class="bar-label" fill="#00356b">74%</text>
    <text x="947" y="358" text-anchor="middle" class="axis-label">After PE</text>

    <!-- Delta annotation -->
    <line x1="1035" y1="218" x2="1035" y2="192" stroke="#1d63d8" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="1050" y="205" class="accent" font-size="14">+13.2pp</text>
  </g>

  <!-- ============ Panel C: Post-PE M&A probability ============ -->
  <g id="panel-c">
    <text x="40" y="446" class="subtitle">Panel C: Post-PE M&amp;A Probability</text>
    <rect x="40" y="456" width="520" height="222" fill="#ffffff" stroke="#e7e9ec" stroke-width="1.5" rx="4"/>
    <text x="26" y="560" class="axis-label" text-anchor="middle" transform="rotate(-90 26 560)">M&amp;A Probability</text>

    <!-- Grid: 0,20,40,60 at 2.7px/% (0%=650) -->
    <line x1="70" y1="650" x2="550" y2="650" class="grid-line"/>
    <line x1="70" y1="596" x2="550" y2="596" class="grid-line"/>
    <line x1="70" y1="542" x2="550" y2="542" class="grid-line"/>
    <line x1="70" y1="488" x2="550" y2="488" class="grid-line"/>
    <!-- Y-axis labels -->
    <text x="65" y="654" text-anchor="end" class="axis-label">0%</text>
    <text x="65" y="600" text-anchor="end" class="axis-label">20%</text>
    <text x="65" y="546" text-anchor="end" class="axis-label">40%</text>
    <text x="65" y="492" text-anchor="end" class="axis-label">60%</text>
    <!-- Axes -->
    <line x1="70" y1="650" x2="70" y2="470" stroke="#c9ced6" stroke-width="1.5"/>
    <line x1="70" y1="650" x2="550" y2="650" stroke="#c9ced6" stroke-width="1.5"/>

    <!-- Pair 1: 1-year. Baseline 4.6% (h=12), +PE 52% (h=140) -->
    <rect x="130" y="638" width="55" height="12" fill="#6f9bcc"/>
    <text x="157" y="632" text-anchor="middle" class="bar-label">4.6%</text>
    <text x="157" y="668" text-anchor="middle" class="axis-label">Baseline</text>

    <rect x="195" y="510" width="55" height="140" fill="#1d63d8"/>
    <text x="222" y="530" text-anchor="middle" class="data-label">52%</text>
    <text x="222" y="668" text-anchor="middle" class="axis-label">+PE (1-yr)</text>
    <text x="215" y="500" text-anchor="middle" class="accent" font-size="12">+47.6pp</text>

    <!-- Pair 2: 3-year. Baseline 9.4% (h=25), +PE 64% (h=173) -->
    <rect x="350" y="625" width="55" height="25" fill="#6f9bcc"/>
    <text x="377" y="619" text-anchor="middle" class="bar-label">9.4%</text>
    <text x="377" y="668" text-anchor="middle" class="axis-label">Baseline</text>

    <rect x="415" y="477" width="55" height="173" fill="#1d63d8"/>
    <text x="442" y="497" text-anchor="middle" class="data-label">64%</text>
    <text x="442" y="668" text-anchor="middle" class="axis-label">+PE (3-yr)</text>
    <text x="435" y="467" text-anchor="middle" class="accent" font-size="12">+55.1pp</text>
  </g>

  <!-- ============ Panel D: ERISA audit fees (SDID event-time) ============ -->
  <g id="panel-d">
    <text x="620" y="446" class="subtitle">Panel D: ERISA Audit Fees Post-PE (SDID)</text>
    <rect x="620" y="456" width="520" height="222" fill="#ffffff" stroke="#e7e9ec" stroke-width="1.5" rx="4"/>
    <text x="606" y="560" class="axis-label" text-anchor="middle" transform="rotate(-90 606 560)">Fee Change vs. Synthetic Control (%)</text>

    <!-- Grid: 0,10,20,30 at 5.5px/% (0%=650) -->
    <line x1="650" y1="650" x2="1120" y2="650" class="grid-line"/>
    <line x1="650" y1="595" x2="1120" y2="595" class="grid-line"/>
    <line x1="650" y1="540" x2="1120" y2="540" class="grid-line"/>
    <line x1="650" y1="485" x2="1120" y2="485" class="grid-line"/>
    <!-- Y-axis labels -->
    <text x="645" y="654" text-anchor="end" class="axis-label">0%</text>
    <text x="645" y="599" text-anchor="end" class="axis-label">10%</text>
    <text x="645" y="544" text-anchor="end" class="axis-label">20%</text>
    <text x="645" y="489" text-anchor="end" class="axis-label">30%</text>
    <!-- Axes -->
    <line x1="650" y1="650" x2="650" y2="470" stroke="#c9ced6" stroke-width="1.5"/>
    <line x1="650" y1="650" x2="1120" y2="650" stroke="#c9ced6" stroke-width="1.5"/>

    <!-- Panel-regression headline callout -->
    <text x="660" y="474" class="axis-label" font-size="12" fill="#00356b" font-weight="700">Panel est.: &#8776;+7% in year after entry (t+1)</text>

    <!-- Bars: SDID event-time ATT. Pre ~0, t+1 ~+4%, t+2 ~+9%, t+3 ~+30% -->
    <rect x="700" y="647" width="55" height="3" fill="#6f9bcc"/>
    <text x="727" y="640" text-anchor="middle" class="bar-label">&#8776;0</text>
    <text x="727" y="668" text-anchor="middle" class="axis-label">t&#8722;1</text>

    <rect x="795" y="628" width="55" height="22" fill="#1d63d8"/>
    <text x="822" y="620" text-anchor="middle" class="bar-label" fill="#1d63d8">&#8776;+4%</text>
    <text x="822" y="668" text-anchor="middle" class="axis-label">t+1</text>

    <rect x="890" y="600" width="55" height="50" fill="#1d63d8"/>
    <text x="917" y="592" text-anchor="middle" class="bar-label" fill="#1d63d8">&#8776;+9%</text>
    <text x="917" y="668" text-anchor="middle" class="axis-label">t+2</text>

    <rect x="985" y="485" width="55" height="165" fill="#1d63d8"/>
    <text x="1012" y="477" text-anchor="middle" class="accent" font-size="13">&#8776;+30%</text>
    <text x="1012" y="668" text-anchor="middle" class="axis-label">t+3</text>

    <text x="660" y="492" class="note">t+1 = first post-investment year</text>
  </g>

  <!-- Footer: data and sources -->
  <rect x="40" y="692" width="1100" height="18" fill="#f2f5f9" rx="3"/>
  <text x="50" y="705" class="axis-label" font-size="10">
    Data: 3,600+ PE transactions (1999&#8211;2024) linked to audit firms; Top 100 accounting-firm sample; ERISA plan audits. Sources: PitchBook, Preqin, Audit Analytics, DOL Form 5500, Revelio Labs.
  </text>
</svg>
